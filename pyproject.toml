[project]
name = "stocktradingbot"
version = "0.1.0"
description = "Deterministic, paper-trading-first swing-trading bot for US equities (Alpaca)."
readme = "README.md"
authors = [{ name = "Kai0421" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alpaca-py>=0.40",
    "certifi>=2026.7.22",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.34.2",
    "slack-sdk>=3.45.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
# Only for STRATEGY=kronos_rank's forecast job (python -m bot.kronos); the bot never imports it.
kronos = [
    "torch>=2.0",
    "einops>=0.8.1",
    "huggingface-hub>=0.33.1",
    "safetensors>=0.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build naive datetimes to check they are rejected.
"tests/**" = ["DTZ001"]
